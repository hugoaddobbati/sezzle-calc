# Serves the built React app and forwards API calls to the Go backend.
# The browser only ever talks to this server, so no CORS is needed.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # "backend" is the Compose service name, resolved on Compose's network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
